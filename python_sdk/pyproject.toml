[project]
name = "vilssharpx-sdk"
version = "1.0.0"
description = "Python SDK for the VilsSharpX WPF localhost automation REST API"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []  # standard library only

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vilssharpx*"]
